<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b2b4b" />
<link rel="manifest" href="manifest.webmanifest" />
<title>発注管理 v1.1</title>
<style>
:root{--navy:#0b2b4b;--bg:#f3f5f8;--line:#d7dee7;--muted:#667085;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:#17202a}
header{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:14px 16px;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:space-between}
main{max-width:980px;margin:0 auto;padding:14px 14px 100px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.grow{flex:1 1 200px}.field{margin:8px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:700}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #b9c4d0;border-radius:9px;background:#fff}textarea{min-height:74px;resize:vertical}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#eaf0f6;color:var(--navy)}.danger{background:#fee4e2;color:var(--red)}.small{padding:7px 9px;font-size:12px}.wide{width:100%}button:disabled{opacity:.55;cursor:wait}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--navy);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:flex;justify-content:flex-start;gap:3px;overflow-x:auto;-webkit-overflow-scrolling:touch}.tabs button{background:transparent;color:#fff;min-width:64px;flex:1 0 64px;font-size:11px;padding:9px 5px}.tabs button.active{background:rgba(255,255,255,.16)}
.hidden{display:none!important}.title{font-size:20px;font-weight:900;margin:4px 0 12px}.sub{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #e5e7eb;padding:9px 7px;text-align:left;vertical-align:middle}th{background:#f8fafc;font-size:12px;color:#475467}.tablewrap{overflow:auto}.qty{width:90px}.empty{text-align:center;color:var(--muted);padding:28px 8px}.msg{padding:10px;border-radius:9px;margin:8px 0;font-size:13px}.ok{background:#ecfdf3;color:#027a48}.err{background:#fef3f2;color:#b42318}.warn{background:#fffaeb;color:#b54708}.login{max-width:460px;margin:22px auto}.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.homegrid button{min-height:82px;font-size:16px}.shipbox{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
@media(max-width:620px){.homegrid{grid-template-columns:1fr 1fr}.hide-mobile{display:none}th,td{white-space:nowrap}.row>.grow{flex-basis:100%}}
@media print{body{background:#fff}.no-print,header,.tabs{display:none!important}main{padding:0;max-width:none}.card{border:0;box-shadow:none;padding:0}.print-sheet{display:block!important}@page{size:A4 portrait;margin:10mm}}
.print-sheet{display:none}.print-head{text-align:center;font-size:22px;font-weight:900;margin:0 0 12px}.print-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.print-box{border:1px solid #333;padding:7px}.print-table th,.print-table td{border:1px solid #333;padding:7px}.print-foot{margin-top:14px;border:1px solid #333;padding:9px}
</style>
</head>
<body>
<header><span>発注管理 <small style="font-size:11px;opacity:.75">v1.1</small></span><button id="logoutBtn" class="secondary small hidden">ログアウト</button></header>
<main>
<section id="setupView" class="login hidden"><div class="card"><div class="title">Supabase接続設定</div><div class="sub">Project URL と Anon Key を入力してください。</div><div id="setupMsg"></div><div class="field"><label>Project URL</label><input id="sbUrl" placeholder="https://xxxxx.supabase.co"></div><div class="field"><label>Anon Key</label><textarea id="sbKey" placeholder="eyJ..."></textarea></div><button id="saveConfigBtn" class="primary wide">接続設定を保存</button></div></section>
<section id="authView" class="login hidden"><div class="card"><div class="title">ログイン</div><div class="sub">Supabase Auth のメールアドレスとパスワードでログインします。</div><div id="authMsg"></div><div class="field"><label>メールアドレス</label><input id="email" type="email"></div><div class="field"><label>パスワード</label><input id="password" type="password"></div><button id="loginBtn" class="primary wide">ログイン</button><div style="height:8px"></div><button id="showSetupBtn" class="secondary wide">Supabase接続設定を変更</button></div></section>
<section id="appView" class="hidden">
<div id="appStatus"></div>
<section data-page="home"><div class="card"><div class="title">ホーム</div><div class="homegrid"><button class="primary" data-go="new">＋ 新規発注</button><button class="primary" data-go="history">📋 発注履歴</button><button class="secondary" data-go="vendors">🏢 発注先</button><button class="secondary" data-go="destinations">🚚 発送先</button><button class="secondary" data-go="products">📦 商品</button></div></div></section>
<section data-page="new" class="hidden"><div class="card"><div class="title" id="orderTitle">新規発注</div><div id="orderMsg"></div><div class="row"><div class="grow field"><label>発注先</label><select id="orderVendor"></select></div><div class="grow field"><label>発送先</label><select id="orderDestination"></select></div><div class="field"><label>発注日</label><input id="orderDate" type="date"></div><div class="field"><label>納品希望日</label><input id="deliveryDate" type="date"></div></div><div id="destinationPreview" class="shipbox sub">発送先を選択してください</div><div class="field"><label>備考</label><textarea id="orderNote"></textarea></div><div class="tablewrap"><table><thead><tr><th>商品</th><th>規格</th><th>単位</th><th>数量</th></tr></thead><tbody id="orderProducts"></tbody></table></div><div class="toolbar"><button id="saveOrderBtn" class="primary">発注を確定</button><button id="cancelDraftBtn" class="secondary">入力をクリア</button></div></div></section>
<section data-page="history" class="hidden"><div class="card"><div class="title">発注履歴</div><div class="row"><div class="grow field"><label>発注先で絞り込み</label><select id="historyVendor"></select></div></div><div class="tablewrap"><table><thead><tr><th>発注日</th><th>発注先</th><th>発送先</th><th>納品希望日</th><th>品数</th><th>操作</th></tr></thead><tbody id="historyBody"></tbody></table></div></div></section>
<section data-page="vendors" class="hidden"><div class="card"><div class="title">発注先マスター</div><div id="vendorMsg"></div><div class="row"><div class="grow field"><label>会社名</label><input id="vName"></div><div class="grow field"><label>FAX番号</label><input id="vFax"></div></div><div class="row"><div class="grow field"><label>電話番号</label><input id="vPhone"></div><div class="grow field"><label>担当者名</label><input id="vPerson"></div></div><div class="field"><label>住所</label><input id="vAddress"></div><div class="field"><label>備考</label><input id="vNote"></div><button id="addVendorBtn" class="primary">発注先を登録</button><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>会社名</th><th>FAX</th><th>担当</th><th></th></tr></thead><tbody id="vendorBody"></tbody></table></div></div></section>
<section data-page="destinations" class="hidden"><div class="card"><div class="title">発送先マスター</div><div class="sub">自社も発送先として登録しておくと、新規発注で「自社」と「得意先直送」を同じプルダウンから選べます。</div><div id="destinationMsg"></div><div class="row"><div class="grow field"><label>発送先名</label><input id="dName" placeholder="例：山三商事 本社"></div><div class="grow field"><label>担当者名</label><input id="dPerson"></div></div><div class="row"><div class="field"><label>郵便番号</label><input id="dPostal"></div><div class="grow field"><label>電話番号</label><input id="dPhone"></div></div><div class="field"><label>住所</label><input id="dAddress"></div><div class="field"><label>備考</label><input id="dNote"></div><button id="addDestinationBtn" class="primary">発送先を登録</button><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>発送先名</th><th>住所</th><th>電話</th><th></th></tr></thead><tbody id="destinationBody"></tbody></table></div></div></section>
<section data-page="products" class="hidden"><div class="card"><div class="title">商品マスター</div><div id="productMsg"></div><div class="row"><div class="grow field"><label>発注先</label><select id="pVendor"></select></div><div class="grow field"><label>商品名</label><input id="pName"></div></div><div class="row"><div class="grow field"><label>商品コード</label><input id="pCode"></div><div class="grow field"><label>規格</label><input id="pSpec"></div><div class="field"><label>単位</label><input id="pUnit" placeholder="ケース"></div></div><div class="row"><div class="field"><label>入数</label><input id="pPack"></div><div class="field"><label>並び順</label><input id="pSort" type="number" value="100"></div></div><button id="addProductBtn" class="primary">商品を登録</button><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>発注先</th><th>商品</th><th>規格</th><th>単位</th><th></th></tr></thead><tbody id="productBody"></tbody></table></div></div></section>
<section data-page="detail" class="hidden"><div class="card no-print"><div class="title">発注詳細</div><div id="detailBox"></div><div class="toolbar"><button id="printBtn" class="primary">PDF・印刷</button><button id="duplicateBtn" class="secondary">この発注を複製</button><button id="deleteOrderBtn" class="danger">削除</button></div></div><div id="printSheet" class="print-sheet"></div></section>
<nav class="tabs no-print"><button data-go="home">🏠<br>ホーム</button><button data-go="new">＋<br>新規発注</button><button data-go="history">📋<br>履歴</button><button data-go="vendors">🏢<br>発注先</button><button data-go="destinations">🚚<br>発送先</button><button data-go="products">📦<br>商品</button></nav>
</section>
</main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const state={vendors:[],destinations:[],products:[],orders:[],currentOrder:null,draftSource:null};
const cfg=()=>JSON.parse(localStorage.getItem('orderapp.supabase')||'null');const sess=()=>JSON.parse(localStorage.getItem('orderapp.session')||'null');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const today=()=>new Date().toLocaleDateString('sv-SE');
function msg(el,text,ok=true,kind=''){el.innerHTML=text?`<div class="msg ${kind|| (ok?'ok':'err')}">${esc(text)}</div>`:''}
function friendlyError(e){const t=String(e?.message||e||'エラー');if(/Load failed|Failed to fetch|NetworkError|AbortError/i.test(t))return '通信に失敗しました。回線を確認して、もう一度お試しください。';try{const j=JSON.parse(t);return j.message||j.hint||t}catch{return t.length>220?t.slice(0,220)+'…':t}}
async function api(path,{method='GET',body=null,auth=true,headers={},timeout=12000,retry=true}={}){const c=cfg();if(!c)throw new Error('Supabase未設定');const s=sess();const h={apikey:c.key,'Content-Type':'application/json',...headers};if(auth&&s?.access_token)h.Authorization=`Bearer ${s.access_token}`;const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),timeout);let r;try{r=await fetch(c.url+path,{method,headers:h,body:body?JSON.stringify(body):null,signal:ctrl.signal})}catch(e){clearTimeout(timer);throw new Error(e.name==='AbortError'?'通信がタイムアウトしました。もう一度お試しください。':friendlyError(e))}clearTimeout(timer);if(r.status===401&&s?.refresh_token&&retry){await refreshSession();return api(path,{method,body,auth,headers,timeout,retry:false})}if(!r.ok){const t=await r.text();throw new Error(t||`HTTP ${r.status}`)}if(r.status===204)return null;const t=await r.text();if(!t)return null;try{return JSON.parse(t)}catch{throw new Error('Supabaseから不正な応答を受信しました。ページを再読み込みしてください。')}}
async function refreshSession(){const c=cfg(),s=sess();const r=await fetch(`${c.url}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});if(!r.ok){localStorage.removeItem('orderapp.session');throw new Error('再ログインしてください')}localStorage.setItem('orderapp.session',JSON.stringify(await r.json()))}
async function busy(btn,label,fn){if(btn.disabled)return;const old=btn.textContent;btn.disabled=true;btn.textContent=label;try{return await fn()}finally{btn.disabled=false;btn.textContent=old}}
function show(id){['setupView','authView','appView'].forEach(x=>$('#'+x).classList.add('hidden'));$('#'+id).classList.remove('hidden');$('#logoutBtn').classList.toggle('hidden',id!=='appView')}
function go(page){$$('[data-page]').forEach(x=>x.classList.toggle('hidden',x.dataset.page!==page));$$('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.go===page));if(page==='new'&&!state.draftSource)resetOrder();if(page==='history')renderHistory();if(page==='vendors')renderVendors();if(page==='destinations')renderDestinations();if(page==='products')renderProducts()}
async function login(){await busy($('#loginBtn'),'ログイン中…',async()=>{try{msg($('#authMsg'),'');const c=cfg();const r=await fetch(`${c.url}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})});if(!r.ok)throw new Error('メールアドレスまたはパスワードを確認してください');localStorage.setItem('orderapp.session',JSON.stringify(await r.json()));await startApp()}catch(e){msg($('#authMsg'),friendlyError(e),false)}})}
async function loadVendors(){state.vendors=await api('/rest/v1/vendors?select=*&order=name')||[]}
async function loadDestinations(){state.destinations=await api('/rest/v1/shipping_destinations?select=*&order=name')||[]}
async function loadProducts(){state.products=await api('/rest/v1/products?select=*&order=sort_order,name')||[]}
async function loadOrders(){state.orders=await api('/rest/v1/orders?select=*,order_items(*)&order=order_date.desc,created_at.desc')||[]}
async function startApp(){show('appView');msg($('#appStatus'),'データを読み込んでいます…',true,'warn');const jobs=await Promise.allSettled([loadVendors(),loadDestinations(),loadProducts(),loadOrders()]);const failures=jobs.filter(x=>x.status==='rejected');renderAll();if(failures.length)msg($('#appStatus'),`一部データの読み込みに失敗しました（${failures.length}件）。画面操作は続けられます。`,false);else msg($('#appStatus'),'');go('home')}
function vendorOptions(all=false){return `${all?'<option value="">すべて</option>':'<option value="">発注先を選択</option>'}`+state.vendors.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}
function destinationOptions(){return '<option value="">発送先を選択</option>'+state.destinations.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}
function renderAll(){['orderVendor','pVendor'].forEach(id=>$('#'+id).innerHTML=vendorOptions());$('#historyVendor').innerHTML=vendorOptions(true);$('#orderDestination').innerHTML=destinationOptions();renderVendors();renderDestinations();renderProducts();renderHistory()}
function renderVendors(){$('#vendorBody').innerHTML=state.vendors.length?state.vendors.map(v=>`<tr><td>${esc(v.name)}</td><td>${esc(v.fax||'')}</td><td>${esc(v.contact_person||'')}</td><td><button class="danger small" onclick="deleteVendor('${v.id}')">削除</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">まだ発注先がありません</td></tr>'}
function renderDestinations(){$('#destinationBody').innerHTML=state.destinations.length?state.destinations.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.address||'')}</td><td>${esc(d.phone||'')}</td><td><button class="danger small" onclick="deleteDestination('${d.id}')">削除</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">まだ発送先がありません</td></tr>'}
function renderProducts(){const vm=Object.fromEntries(state.vendors.map(v=>[v.id,v.name]));$('#productBody').innerHTML=state.products.length?state.products.map(p=>`<tr><td>${esc(vm[p.vendor_id]||'')}</td><td>${esc(p.name)}</td><td>${esc(p.spec||'')}</td><td>${esc(p.unit||'')}</td><td><button class="danger small" onclick="deleteProduct('${p.id}')">削除</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">まだ商品がありません</td></tr>'}
function resetOrder(){state.draftSource=null;$('#orderTitle').textContent='新規発注';$('#orderDate').value=today();$('#deliveryDate').value='';$('#orderNote').value='';$('#orderVendor').value='';$('#orderDestination').value='';$('#destinationPreview').textContent='発送先を選択してください';$('#orderProducts').innerHTML='<tr><td colspan="4" class="empty">発注先を選択してください</td></tr>';msg($('#orderMsg'),'')}
function renderDestinationPreview(){const d=state.destinations.find(x=>x.id===$('#orderDestination').value);$('#destinationPreview').innerHTML=d?`<b>${esc(d.name)}</b><br>${esc([d.postal_code?`〒${d.postal_code}`:'',d.address].filter(Boolean).join(' '))}${d.phone?`<br>TEL: ${esc(d.phone)}`:''}${d.contact_person?`<br>担当: ${esc(d.contact_person)}`:''}`:'発送先を選択してください'}
function renderOrderProducts(prefill={}){const vid=$('#orderVendor').value;const ps=state.products.filter(p=>p.vendor_id===vid&&p.active!==false);$('#orderProducts').innerHTML=ps.length?ps.map(p=>`<tr><td>${esc(p.name)}${p.code?`<div class="sub">${esc(p.code)}</div>`:''}</td><td>${esc(p.spec||'')}</td><td>${esc(p.unit||'')}</td><td><input class="qty" inputmode="decimal" data-product="${p.id}" value="${esc(prefill[p.id]??'')}" placeholder="0"></td></tr>`).join(''):'<tr><td colspan="4" class="empty">この発注先の商品がありません</td></tr>'}
async function addVendor(){await busy($('#addVendorBtn'),'登録中…',async()=>{try{msg($('#vendorMsg'),'');const name=$('#vName').value.trim();if(!name)throw new Error('会社名を入力してください');await api('/rest/v1/vendors',{method:'POST',body:{name,fax:$('#vFax').value.trim(),phone:$('#vPhone').value.trim(),contact_person:$('#vPerson').value.trim(),address:$('#vAddress').value.trim(),note:$('#vNote').value.trim()},headers:{Prefer:'return=minimal'}});['vName','vFax','vPhone','vPerson','vAddress','vNote'].forEach(i=>$('#'+i).value='');await loadVendors();renderAll();msg($('#vendorMsg'),'登録しました')}catch(e){msg($('#vendorMsg'),friendlyError(e),false)}})}
async function addDestination(){await busy($('#addDestinationBtn'),'登録中…',async()=>{try{msg($('#destinationMsg'),'');const name=$('#dName').value.trim();if(!name)throw new Error('発送先名を入力してください');await api('/rest/v1/shipping_destinations',{method:'POST',body:{name,postal_code:$('#dPostal').value.trim(),address:$('#dAddress').value.trim(),phone:$('#dPhone').value.trim(),contact_person:$('#dPerson').value.trim(),note:$('#dNote').value.trim()},headers:{Prefer:'return=minimal'}});['dName','dPostal','dAddress','dPhone','dPerson','dNote'].forEach(i=>$('#'+i).value='');await loadDestinations();$('#orderDestination').innerHTML=destinationOptions();renderDestinations();msg($('#destinationMsg'),'登録しました')}catch(e){msg($('#destinationMsg'),friendlyError(e),false)}})}
async function addProduct(){await busy($('#addProductBtn'),'登録中…',async()=>{try{msg($('#productMsg'),'');if(!$('#pVendor').value)throw new Error('発注先を選択してください');if(!$('#pName').value.trim())throw new Error('商品名を入力してください');await api('/rest/v1/products',{method:'POST',body:{vendor_id:$('#pVendor').value,name:$('#pName').value.trim(),code:$('#pCode').value.trim(),spec:$('#pSpec').value.trim(),unit:$('#pUnit').value.trim(),pack_size:$('#pPack').value.trim(),sort_order:Number($('#pSort').value)||100,active:true},headers:{Prefer:'return=minimal'}});['pName','pCode','pSpec','pUnit','pPack'].forEach(i=>$('#'+i).value='');await loadProducts();renderProducts();msg($('#productMsg'),'登録しました')}catch(e){msg($('#productMsg'),friendlyError(e),false)}})}
async function deleteVendor(id){if(!confirm('発注先を削除しますか？\n商品や履歴がある発注先は削除できません。'))return;try{await api(`/rest/v1/vendors?id=eq.${id}`,{method:'DELETE'});await loadVendors();renderAll()}catch(e){alert(friendlyError(e))}}
async function deleteDestination(id){if(!confirm('発送先を削除しますか？\n発注履歴で使用済みの場合は削除できません。'))return;try{await api(`/rest/v1/shipping_destinations?id=eq.${id}`,{method:'DELETE'});await loadDestinations();$('#orderDestination').innerHTML=destinationOptions();renderDestinations()}catch(e){alert(friendlyError(e))}}
async function deleteProduct(id){if(!confirm('商品を削除しますか？'))return;try{await api(`/rest/v1/products?id=eq.${id}`,{method:'DELETE'});await loadProducts();renderProducts()}catch(e){alert(friendlyError(e))}}
async function saveOrder(){await busy($('#saveOrderBtn'),'保存中…',async()=>{let oid=null;try{msg($('#orderMsg'),'');const vendor_id=$('#orderVendor').value;if(!vendor_id)throw new Error('発注先を選択してください');const d=state.destinations.find(x=>x.id===$('#orderDestination').value);if(!d)throw new Error('発送先を選択してください');const items=$$('#orderProducts .qty').map(i=>({product_id:i.dataset.product,quantity:Number(i.value)})).filter(x=>Number.isFinite(x.quantity)&&x.quantity>0);if(!items.length)throw new Error('発注数量を1商品以上入力してください');const body={vendor_id,shipping_destination_id:d.id,shipping_name:d.name,shipping_postal_code:d.postal_code||'',shipping_address:d.address||'',shipping_phone:d.phone||'',shipping_contact_person:d.contact_person||'',order_date:$('#orderDate').value||today(),delivery_date:$('#deliveryDate').value||null,note:$('#orderNote').value.trim(),status:'ordered'};const result=await api('/rest/v1/orders',{method:'POST',body,headers:{Prefer:'return=representation'}});oid=result?.[0]?.id;if(!oid)throw new Error('発注番号の取得に失敗しました');await api('/rest/v1/order_items',{method:'POST',body:items.map(x=>({...x,order_id:oid})),headers:{Prefer:'return=minimal'}});await loadOrders();renderHistory();msg($('#orderMsg'),'発注を保存しました');openDetail(oid)}catch(e){if(oid){try{await api(`/rest/v1/orders?id=eq.${oid}`,{method:'DELETE',timeout:5000})}catch{}}msg($('#orderMsg'),friendlyError(e),false)}})}
function renderHistory(){const vf=$('#historyVendor').value;const vm=Object.fromEntries(state.vendors.map(v=>[v.id,v.name]));const arr=state.orders.filter(o=>!vf||o.vendor_id===vf);$('#historyBody').innerHTML=arr.length?arr.map(o=>`<tr><td>${esc(o.order_date)}</td><td>${esc(vm[o.vendor_id]||'')}</td><td>${esc(o.shipping_name||'')}</td><td>${esc(o.delivery_date||'')}</td><td>${o.order_items?.length||0}</td><td><button class="secondary small" onclick="openDetail('${o.id}')">開く</button> <button class="primary small" onclick="duplicateOrder('${o.id}')">複製</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">発注履歴がありません</td></tr>'}
function buildOrderData(o){const v=state.vendors.find(x=>x.id===o.vendor_id);const pm=Object.fromEntries(state.products.map(p=>[p.id,p]));return{o,v,items:(o.order_items||[]).map(i=>({...i,p:pm[i.product_id]})).filter(x=>x.p)}}
function shippingText(o){return [o.shipping_name,o.shipping_postal_code?`〒${o.shipping_postal_code}`:'',o.shipping_address,o.shipping_phone?`TEL: ${o.shipping_phone}`:'',o.shipping_contact_person?`担当: ${o.shipping_contact_person}`:''].filter(Boolean)}
function openDetail(id){const o=state.orders.find(x=>x.id===id);if(!o)return;state.currentOrder=o;const{v,items}=buildOrderData(o);$('#detailBox').innerHTML=`<div class="row"><div class="grow"><b>発注先：</b>${esc(v?.name||'')}</div><div><b>発注日：</b>${esc(o.order_date)}</div><div><b>納品希望日：</b>${esc(o.delivery_date||'')}</div></div><div class="shipbox"><b>発送先</b><br>${shippingText(o).map(esc).join('<br>')}</div><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>商品</th><th>規格</th><th>数量</th><th>単位</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.p.name)}</td><td>${esc(i.p.spec||'')}</td><td>${esc(i.quantity)}</td><td>${esc(i.p.unit||'')}</td></tr>`).join('')}</tbody></table></div>${o.note?`<p><b>備考：</b>${esc(o.note)}</p>`:''}`;buildPrint(o);go('detail')}
function buildPrint(o){const{v,items}=buildOrderData(o);$('#printSheet').innerHTML=`<div class="print-head">発 注 書</div><div class="print-meta"><div class="print-box"><b>発注先</b><br>${esc(v?.name||'')} 御中<br>${esc(v?.address||'')}<br>FAX: ${esc(v?.fax||'')}<br>TEL: ${esc(v?.phone||'')}</div><div class="print-box"><b>発注日：</b>${esc(o.order_date)}<br><b>納品希望日：</b>${esc(o.delivery_date||'')}<br><br><b>発送先</b><br>${shippingText(o).map(esc).join('<br>')}</div></div><table class="print-table"><thead><tr><th style="width:45%">商品名</th><th>規格</th><th style="width:12%">数量</th><th style="width:12%">単位</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.p.name)}</td><td>${esc(i.p.spec||'')}</td><td>${esc(i.quantity)}</td><td>${esc(i.p.unit||'')}</td></tr>`).join('')}</tbody></table><div class="print-foot"><b>備考</b><br>${esc(o.note||'')}</div>`}
function duplicateOrder(id){const o=state.orders.find(x=>x.id===id);if(!o)return;state.draftSource=o.id;$('#orderTitle').textContent='発注履歴から複製';$('#orderVendor').value=o.vendor_id;$('#orderDestination').value=o.shipping_destination_id||'';renderDestinationPreview();$('#orderDate').value=today();$('#deliveryDate').value=o.delivery_date||'';$('#orderNote').value=o.note||'';const q={};(o.order_items||[]).forEach(i=>q[i.product_id]=i.quantity);renderOrderProducts(q);go('new')}
async function deleteOrder(){const o=state.currentOrder;if(!o||!confirm('この発注履歴を削除しますか？'))return;try{await api(`/rest/v1/orders?id=eq.${o.id}`,{method:'DELETE'});state.currentOrder=null;await loadOrders();renderHistory();go('history')}catch(e){alert(friendlyError(e))}}
$('#saveConfigBtn').onclick=()=>{const url=$('#sbUrl').value.trim().replace(/\/$/,'');const key=$('#sbKey').value.trim();if(!url||!key)return msg($('#setupMsg'),'URLとAnon Keyを入力してください',false);localStorage.setItem('orderapp.supabase',JSON.stringify({url,key}));show('authView')};
$('#showSetupBtn').onclick=()=>{const c=cfg();$('#sbUrl').value=c?.url||'';$('#sbKey').value=c?.key||'';show('setupView')};$('#loginBtn').onclick=login;$('#logoutBtn').onclick=()=>{localStorage.removeItem('orderapp.session');show('authView')};
$('#addVendorBtn').onclick=addVendor;$('#addDestinationBtn').onclick=addDestination;$('#addProductBtn').onclick=addProduct;$('#saveOrderBtn').onclick=saveOrder;$('#cancelDraftBtn').onclick=resetOrder;$('#orderVendor').onchange=()=>renderOrderProducts();$('#orderDestination').onchange=renderDestinationPreview;$('#historyVendor').onchange=renderHistory;$('#printBtn').onclick=()=>window.print();$('#duplicateBtn').onclick=()=>state.currentOrder&&duplicateOrder(state.currentOrder.id);$('#deleteOrderBtn').onclick=deleteOrder;
$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));window.deleteVendor=deleteVendor;window.deleteDestination=deleteDestination;window.deleteProduct=deleteProduct;window.openDetail=openDetail;window.duplicateOrder=duplicateOrder;
(async function init(){if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});const c=cfg();if(!c){show('setupView');return}const s=sess();if(!s){show('authView');return}try{await startApp()}catch(e){show('authView');msg($('#authMsg'),friendlyError(e),false)}})();
</script>
</body></html>
